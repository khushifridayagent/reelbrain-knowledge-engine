name: Reelbrain scheduled media batch (opt-in)

# A bounded alternative to an always-on VM; scheduled runs are best-effort,
# not a guarantee of continuous service or successful Instagram downloads.
on:
  workflow_dispatch:
  # Kick off one execution as soon as this workflow update reaches main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/reelbrain-media-batch.yml'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: reelbrain-media-batch
  cancel-in-progress: false

jobs:
  process-one-reel:
    # Repo variable is OPTIONAL: set it to 0 only to pause the worker.
    # An absent variable no longer blocks processing after the secret exists.
    if: ${{ vars.REELBRAIN_WORKER_ENABLED != '0' }}
    runs-on: ubuntu-24.04
    # Lower than the database lease (15 min) to avoid running after expiry.
    timeout-minutes: 14
    env:
      REELBRAIN_DB_URL: ${{ secrets.REELBRAIN_DB_URL }}
      REELBRAIN_PERSONAL_KNOWLEDGE_USE_APPROVED: '1'
      REELBRAIN_MEDIA_ACQUISITION: 'yt_dlp_public'
      REELBRAIN_ALLOW_PUBLIC_REEL_DOWNLOAD: '1'
      # Optional private Netscape cookies.txt, encoded as base64.
      # Do not use a repository variable or commit cookies to git.
      REELBRAIN_INSTAGRAM_COOKIES_B64: ${{ secrets.REELBRAIN_INSTAGRAM_COOKIES_B64 }}
      # Free open-source CPU speech fallback (downloaded/cached on demand).
      REELBRAIN_ENABLE_LOCAL_ASR: '1'
      REELBRAIN_LOCAL_ASR_MODEL: 'small'
      # External hosted visual inference requires an actual GPU service
      # and explicit opt-in; repository secrets never enter GitHub code.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REELBRAIN_QWEN_VL_BASE_URL: ${{ secrets.REELBRAIN_QWEN_VL_BASE_URL }}
      REELBRAIN_QWEN_VL_API_KEY: ${{ secrets.REELBRAIN_QWEN_VL_API_KEY }}
      REELBRAIN_QWEN_VL_MODEL: ${{ vars.REELBRAIN_QWEN_VL_MODEL || 'Qwen/Qwen3-VL-8B-Instruct' }}
      # No paid acquisition, private/cookie access or model uploads by default.
      REELBRAIN_PAID_PROVIDER_APPROVED: '0'
      REELBRAIN_EXTERNAL_MODEL_UPLOAD_ALLOWED: ${{ vars.REELBRAIN_EXTERNAL_MODEL_UPLOAD_ALLOWED || '0' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Detect dedicated DB secret without logging its value
        id: secret_check
        shell: bash
        run: |
          if [[ -n "${REELBRAIN_DB_URL:-}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Reelbrain DB URL secret exists in this repository; processing will be attempted."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::REELBRAIN_DB_URL is missing from this repository's Actions secrets. Processing skipped."
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.secret_check.outputs.ready == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: ${{ steps.secret_check.outputs.ready == 'true' }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - name: Check eligible Reel jobs before installing heavy media tooling
        id: queue_check
        if: ${{ steps.secret_check.outputs.ready == 'true' }}
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          import psycopg
          db = os.environ.get('REELBRAIN_DB_URL','')
          parsed = urlsplit(db)
          ref = 'xlkdzrhzizuftbnitodr'
          if (parsed.scheme not in ('postgres','postgresql') or
                  ref not in (parsed.username or '').lower() and
                  ref not in (parsed.hostname or '').lower()):
              raise SystemExit('Reelbrain database target is missing or incorrect')
          try:
              with psycopg.connect(db,connect_timeout=6) as con:
                  with con.cursor() as cur:
                      cur.execute("""SELECT COUNT(*) FROM public.reelbrain_dm_jobs
                          WHERE status='queued' AND available_at<=now()
                          AND attempts<max_attempts""")
                      eligible_jobs=int(cur.fetchone()[0])
          except Exception as error:
              raise SystemExit('Reelbrain DB queue unavailable (' +
                               type(error).__name__ + ')')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('has_jobs=' + ('true' if eligible_jobs else 'false') + '\n')
          print('Eligible media jobs:', eligible_jobs)
          if not eligible_jobs:
              print('Queue empty or all sources deferred: skipping heavy installs safely.')
          PY
      - name: Cache open-source Whisper model weights (no user data)
        if: ${{ steps.secret_check.outputs.ready == 'true' && steps.queue_check.outputs.has_jobs == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: reelbrain-faster-whisper-small-v1
      - name: Install real media tooling
        if: ${{ steps.secret_check.outputs.ready == 'true' && steps.queue_check.outputs.has_jobs == 'true' }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
          python -m pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Validate database connection before claiming a Reel
        if: ${{ steps.secret_check.outputs.ready == 'true' && steps.queue_check.outputs.has_jobs == 'true' }}
        run: |
          python - <<'PY'
          from reelbrain.durable_worker import checked_config, pg_open
          config = checked_config()
          try:
              with pg_open(config['db_url']) as con:
                  with con.cursor() as cur:
                      cur.execute('SELECT 1')
                      assert cur.fetchone()[0] == 1
          except Exception as exc:
              raise SystemExit('Dedicated DB connection failed (' + type(exc).__name__ + '): check the full connection URI including password in the GitHub Actions secret.')
          print('Dedicated worker DB connectivity verified; credentials not printed.')
          PY
      - name: Process at most one queued Reel and acknowledge outcome
        if: ${{ steps.secret_check.outputs.ready == 'true' && steps.queue_check.outputs.has_jobs == 'true' }}
        run: |
          python - <<'PY'
          from reelbrain.durable_worker import checked_config, run_one_batch
          from reelbrain.batch_outcome import require_successful_batch
          # The worker writes failure categories to its isolated database and
          # never logs private Reel URLs or the DB credential here.
          result = run_one_batch(checked_config(), batch_size=1)
          print('Claimed jobs:', len(result))
          print('Outcomes:', [item['status'] for item in result])
          # A successful retry/dead-letter ACK is NOT successful media analysis.
          # Failing the run provides accurate GitHub Actions monitoring.
          require_successful_batch(result)
          PY
