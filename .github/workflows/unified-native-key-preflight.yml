name: Unified native hybrid isolated key preflight
on:
  push:
    branches: [feat/unified-native-hybrid]
    paths: ['.github/workflows/unified-native-key-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check key presence only, no API calls or values
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EXTERNAL_UPLOAD_ALLOWED: ${{ vars.REELBRAIN_EXTERNAL_MODEL_UPLOAD_ALLOWED }}
          FREE_APPROVED: ${{ vars.REELBRAIN_HYBRID_FREE_PROVIDERS_CONFIRMED }}
        shell: bash
        run: |
          python - <<'PY'
          import os,json
          print("HYBRID_PREFLIGHT "+json.dumps({
            "gemini_key_present":bool(os.getenv("GEMINI_API_KEY")),
            "groq_key_present":bool(os.getenv("GROQ_API_KEY")),
            "external_upload_allowed":os.getenv("EXTERNAL_UPLOAD_ALLOWED","") in ("1","true","yes"),
            "free_provider_approved":os.getenv("FREE_APPROVED","") in ("1","true","yes")}))
          PY
