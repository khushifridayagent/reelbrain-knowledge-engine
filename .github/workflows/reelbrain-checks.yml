name: Reelbrain isolated validation
on:
  pull_request:
  push:
    branches: [main, feat/instagram-dm-research-v08]
    paths:
      - 'reelbrain/**'
      - 'deploy/reelbrain-cloudflare-clock*'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local dependencies and media test tools
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=25 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=25 install -y ffmpeg tesseract-ocr tesseract-ocr-eng
          python -m pip install -r requirements.txt -r requirements-site.txt -r requirements-web.txt
      - name: Verify pinned local audio decoder against synthetic WAV
        run: |
          python -m pip install --disable-pip-version-check 'faster-whisper==1.2.1' 'av==18.1.0'
          python - <<'PY'
          import tempfile,wave
          from pathlib import Path
          import av
          from faster_whisper.audio import decode_audio
          assert av.__version__ == '18.1.0'
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'synthetic.wav'
              with wave.open(str(p),'wb') as w:
                  w.setnchannels(1);w.setsampwidth(2);w.setframerate(8000)
                  w.writeframes(b'\x00\x00'*3200)
              samples=decode_audio(str(p),sampling_rate=16000)
              assert len(samples)==6400, len(samples)
              print('LOCAL_ASR_DECODE_OK samples=',len(samples))
          PY
      - name: Python tests (real network and model calls are not used)
        run: python -m unittest discover -s tests -t .
      - name: JS parser and coordinator tests
        run: node --test tests/*.test.mjs deploy/reelbrain-cloudflare-clock.test.mjs
      - name: Verify isolated Supabase connection (read-only, no credentials printed)
        if: github.event_name == 'push' && github.repository == 'khushifridayagent/reelbrain-knowledge-engine'
        env:
          REELBRAIN_DB_URL: ${{ secrets.REELBRAIN_DB_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os,sys
          from urllib.parse import urlsplit
          uri=os.environ.get('REELBRAIN_DB_URL','')
          if not uri:
              print('DB_PREFLIGHT: NOT_CONFIGURED (repository secret REELBRAIN_DB_URL missing)')
              sys.exit(0)
          try:
              parsed=urlsplit(uri)
              ref='xlkdzrhzizuftbnitodr'
              if not (ref in (parsed.username or '').lower() or ref in (parsed.hostname or '').lower()):
                  raise ValueError('not_reelbrain_project')
              import psycopg
              with psycopg.connect(uri,connect_timeout=8,options='-c default_transaction_read_only=on') as pg:
                  with pg.cursor() as cur:
                      cur.execute('SELECT count(*) FROM public.reelbrain_dm_jobs')
                      total=cur.fetchone()[0]
              print('DB_PREFLIGHT: CONNECTED_TO_ISOLATED_REELBRAIN, queued_records='+str(total))
          except Exception as exc:
              print('DB_PREFLIGHT: FAILED, error_type='+type(exc).__name__)
              sys.exit(1)
          PY
