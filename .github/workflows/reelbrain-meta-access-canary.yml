name: Reelbrain Meta Graph access canary (one-time)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reelbrain-meta-access-canary.yml'
permissions:
  contents: read
concurrency:
  group: reelbrain-meta-graph-probe
  cancel-in-progress: false
jobs:
  safe-meta-graph-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      REELBRAIN_META_GRAPH_TOKEN: ${{ secrets.REELBRAIN_META_GRAPH_TOKEN }}
      REELBRAIN_META_IG_USER_ID: ${{ vars.REELBRAIN_META_IG_USER_ID }}
      REELBRAIN_META_BUSINESS_DISCOVERY_ENABLED: ${{ vars.REELBRAIN_META_BUSINESS_DISCOVERY_ENABLED || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only lightweight read-only HTTP client
        run: python -m pip install --disable-pip-version-check 'httpx>=0.27,<1'
      - name: Test token expiry, exact own-IG node and one public professional Reel
        shell: bash
        run: |
          python - <<'PY'
          import os,json
          from reelbrain.meta_graph_probe import check_meta_business_access
          status=check_meta_business_access(
            os.environ.get('REELBRAIN_META_GRAPH_TOKEN',''),
            os.environ.get('REELBRAIN_META_IG_USER_ID',''),
            os.environ.get('REELBRAIN_META_BUSINESS_DISCOVERY_ENABLED',''),
            creator='aimortal.ig',shortcode='DgGHCjZIZtW')
          # These are predefined categories/counts only. Never emit token,
          # IG user ID, Graph error message, raw API JSON or media URL.
          print('META_GRAPH_SAFE_DIAGNOSTIC',json.dumps(status,sort_keys=True))
          if status['status']=='original_media_url_available':
              print('Original media URL exists for test source: visual worker may proceed.')
          else:
              raise SystemExit('Meta Graph does not yet provide source media ('+
                               status['status']+')')
          PY
