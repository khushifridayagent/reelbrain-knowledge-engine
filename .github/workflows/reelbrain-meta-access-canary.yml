name: Reelbrain Meta Graph access canary (six-source byte audit)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main, fix/resumable-overlapping-media]
    paths:
      - '.github/workflows/reelbrain-meta-access-canary.yml'
permissions:
  contents: read
concurrency:
  group: reelbrain-meta-graph-probe
  cancel-in-progress: false
jobs:
  safe-meta-graph-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      REELBRAIN_DB_URL: ${{ secrets.REELBRAIN_DB_URL }}
      REELBRAIN_META_GRAPH_TOKEN: ${{ secrets.REELBRAIN_META_PERMANENT_TOKEN || secrets.REELBRAIN_META_GRAPH_TOKEN }}
      REELBRAIN_META_PERMANENT_CONFIGURED: ${{ secrets.REELBRAIN_META_PERMANENT_TOKEN != '' && '1' || '0' }}
      REELBRAIN_META_IG_USER_ID: ${{ vars.REELBRAIN_META_IG_USER_ID }}
      REELBRAIN_META_BUSINESS_DISCOVERY_ENABLED: ${{ vars.REELBRAIN_META_BUSINESS_DISCOVERY_ENABLED || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only lightweight read-only HTTP client
        run: python -m pip install --disable-pip-version-check 'httpx>=0.27,<1' 'psycopg[binary]>=3.2,<4'
      - name: Verify authorized original media bytes from the six queued sources
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from urllib.parse import urlsplit
          import psycopg
          from reelbrain.meta_graph_probe import check_meta_business_access
          from reelbrain.meta_business_media import (
              acquire_meta_bundle, MetaMediaUnavailable, meta_fallback_enabled)
          if not meta_fallback_enabled():
              raise SystemExit('Meta fallback not configured')
          db=os.environ.get('REELBRAIN_DB_URL','')
          u=urlsplit(db)
          ref='xlkdzrhzizuftbnitodr'
          if ref not in (u.username or '') and ref not in (u.hostname or ''):
              raise SystemExit('Dedicated Reelbrain DB target required')
          with psycopg.connect(db,connect_timeout=6) as pg:
              with pg.cursor() as cur:
                  cur.execute("""SELECT j.id,j.source_url,k.creator_handle
                      FROM public.reelbrain_dm_jobs j
                      JOIN public.reelbrain_reel_knowledge k USING(source_url)
                      WHERE j.status IN ('queued','partial','processed') AND k.creator_handle IS NOT NULL
                      ORDER BY j.id DESC LIMIT 6""")
                  rows=cur.fetchall()
          if os.environ.get('REELBRAIN_META_PERMANENT_CONFIGURED') != '1':
              raise SystemExit('Permanent system-user credential not configured')
          source=next(((url,creator) for _,url,creator in rows if creator),None)
          if source:
              url,creator=source
              auth=check_meta_business_access(os.environ['REELBRAIN_META_GRAPH_TOKEN'],
                  os.environ['REELBRAIN_META_IG_USER_ID'],'1',creator=creator,
                  shortcode=url.rstrip('/').rsplit('/',1)[-1])
              print('META_PERMANENT_AUTH',auth)
              if not auth.get('token_valid') or not auth.get('account_id_valid'):
                  raise SystemExit('Permanent Meta account authorization failed')
          tested=success=0
          for job,url,creator in rows:
              if not creator:
                  print('META_SOURCE',job,'creator_missing')
                  continue
              tested+=1
              with TemporaryDirectory(prefix='rb_meta_proof_') as td:
                  try:
                      bundle=acquire_meta_bundle(url,creator,
                          os.environ['REELBRAIN_META_GRAPH_TOKEN'],
                          os.environ['REELBRAIN_META_IG_USER_ID'],Path(td))
                      success+=1
                      print('META_SOURCE',job,'validated_assets',len(bundle.paths),
                            'bytes',sum(p.stat().st_size for p in bundle.paths))
                      # Stop after first genuine acquisition; normal scheduled
                      # production worker remains sole owner of knowledge writes.
                      break
                  except MetaMediaUnavailable as exc:
                      reason=str(exc)
                      print('META_SOURCE',job,reason)
                      if any(tag in reason for tag in (
                          'rate_limited','token_expired_or_invalid',
                          'insufficient_graph_permissions','meta_account_or_app_blocked')):
                          break
          print('META_BYTE_AUDIT tested=',tested,'success=',success)
          if not success:
              raise SystemExit('No original media bytes available in this bounded audit')
          PY
