# Runs only from the default branch after this PR is reviewed/merged.
# GitHub-hosted standard Linux runners are free for public repositories.
# This job DOES NOT attempt media acquisition until the owner supplies
# dedicated Reelbrain DB credentials AND explicitly confirms source rights.
name: Reelbrain scheduled media worker

# Legacy emergency worker only; all automatic claims belong to media-batch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reelbrain-media-batch
  cancel-in-progress: false

jobs:
  process-media:
    if: github.repository == 'khushifridayagent/reelbrain-knowledge-engine' && github.event_name == 'workflow_dispatch' && vars.REELBRAIN_LEGACY_WORKER_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      REELBRAIN_DB_URL: ${{ secrets.REELBRAIN_DB_URL }}
      # Owner approved personal knowledge extraction from accessible public Reels.
      # This does not assert ownership, reuse rights, or allow private/logged-in media.
      REELBRAIN_PERSONAL_KNOWLEDGE_USE_APPROVED: '1'
      REELBRAIN_SOURCE_RIGHTS_CONFIRMED: ${{ secrets.REELBRAIN_SOURCE_RIGHTS_CONFIRMED }}
      REELBRAIN_ALLOW_PUBLIC_REEL_DOWNLOAD: '1'
      REELBRAIN_MEDIA_ACQUISITION: yt_dlp_public
      REELBRAIN_EXTERNAL_MODEL_UPLOAD_ALLOWED: ${{ secrets.REELBRAIN_EXTERNAL_MODEL_UPLOAD_ALLOWED }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_ASR_MODEL: whisper-large-v3-turbo
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_VIDEO_MODEL: ${{ vars.GEMINI_VIDEO_MODEL || 'gemini-3.6-flash' }}

    steps:
      - name: Check required Reelbrain-only configuration without revealing secrets
        id: configured
        shell: bash
        run: |
          if [[ -n "${REELBRAIN_DB_URL}" && "${REELBRAIN_PERSONAL_KNOWLEDGE_USE_APPROVED}" == "1" && "${REELBRAIN_ALLOW_PUBLIC_REEL_DOWNLOAD}" == "1" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Reelbrain media worker is not enabled: dedicated Reelbrain DB secret missing; public personal research authorization is built in."
          fi

      - name: Checkout audited owner repo
        if: steps.configured.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Configure Python
        if: steps.configured.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Install bounded OCR, audio, and media dependencies
        if: steps.configured.outputs.enabled == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
          python -m pip install -r requirements-worker.txt

      - name: Test extraction boundaries (offline fixtures only)
        if: steps.configured.outputs.enabled == 'true'
        run: |
          python -m unittest tests.test_public_media tests.test_media_evidence_summary

      - name: Process up to one queued Reel with real evidence receipts
        if: steps.configured.outputs.enabled == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from reelbrain.durable_worker import checked_config, run_one_batch
          result = run_one_batch(config=checked_config(), batch_size=1)
          # Do not print user DMs, full Reel URLs, database credentials, or model responses.
          print(json.dumps([
              {"job_id": int(item["id"]), "status": str(item["status"])}
              for item in result
          ], separators=(",", ":")))
          PY
