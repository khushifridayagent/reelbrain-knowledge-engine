name: ReelBrain post backup smoke (bounded free credit)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/reelbrain-post-backup-smoke.yml']
permissions:
  contents: read
concurrency:
  group: reelbrain-post-backup-smoke
  cancel-in-progress: false
jobs:
  public-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      REELBRAIN_POST_APIFY_API_TOKEN: ${{ secrets.REELBRAIN_POST_APIFY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'httpx>=0.27,<1'
      - name: Verify account limit and all 12 source images without DB writes
        run: |
          python - <<'PY'
          import os, tempfile
          from reelbrain.apify_post_media import acquire_apify_post
          try:
              with tempfile.TemporaryDirectory() as directory:
                  bundle=acquire_apify_post('https://www.instagram.com/p/DgKh0OxFFSo/', directory, os.environ.get('REELBRAIN_POST_APIFY_API_TOKEN',''))
                  if len(bundle.paths)!=12 or any(p.suffix.lower() not in ('.jpg','.jpeg','.png','.webp') for p in bundle.paths):
                      raise RuntimeError('Expected complete 12-image manifest')
                  print('POST_BACKUP_SMOKE PASS; assets=12; charge ceiling USD 0.02; no permanent media storage')
          except Exception as error:
              from reelbrain.public_media import PublicMediaError
              if isinstance(error,PublicMediaError):
                  print('POST_BACKUP_SMOKE FAIL: '+str(error))
              else:
                  print('POST_BACKUP_SMOKE FAIL: '+type(error).__name__)
              raise SystemExit(1) from None
          PY
