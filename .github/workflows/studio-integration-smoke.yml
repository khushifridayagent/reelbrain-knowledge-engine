name: Studio isolated live integration smoke
on:
  push:
    branches: ['studio/chatbot-integration-v2']
    paths: ['.github/workflows/studio-integration-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check only dedicated chatbot APIs and read-only database
        env:
          GROQ_CHATBOT_API_KEY: ${{ secrets.GROQ_CHATBOT_API_KEY }}
          GEMINI_CHATBOT_API_KEY: ${{ secrets.GEMINI_CHATBOT_API_KEY }}
          GH_CHATBOT_TOKEN: ${{ secrets.GH_CHATBOT_TOKEN }}
          TINYFISH_CHATBOT_API_KEY: ${{ secrets.TINYFISH_CHATBOT_API_KEY }}
          REELBRAIN_DB_URL: ${{ secrets.REELBRAIN_DB_URL }}
        run: python studio/verify_integrations.py
